# yaml-language-server: $schema=../../spore-os-protocol/versions/v0d2/spore.manifest.v0.schema.yaml

id: dev.sporeos.shell
name: Spore Shell
description: An interactive shell (REPL) for sending commands to the Spore-OS ecosystem.
trust: standard

schema: SPORE/v0d2
version: 0.2.0
app: ./spore-shell

api: 
  - name: confirm
    description: Confirm an action with the user.
    risk: standard
    usage:
        - confirm body="Do you want to proceed?" lines=[ "Reasons", " - reason A", " - reason B" ]
    inputs:
        - name: body
          type: string
          description: The message to display to the user.
          required: true
        - name: lines
          type: array
          description: Additional lines to display to the user.
          required: false
    outputs:
        - name: confirm
          type: flag
          description: The presence of this flag indicates confirmation on the action.

topics: []
permissions: []
errors: []
